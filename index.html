<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>與虛擬馮老師語文對話練習（小一中文）</title>
  <style>
    :root {
      --bg-cream: #FFFDF5;
      --bg-pattern: #FEF3C7;
      --header-yellow-start: #FEF08A;
      --header-yellow-end: #FDE047;
      --header-border: #FACC15;
      --sky-blue: #0284C7;
      --sky-blue-light: #E0F2FE;
      --sky-blue-btn: #0EA5E9;
      --grass-green: #16A34A;
      --grass-green-light: #DCFCE7;
      --grass-green-btn: #22C55E;
      --coral-red: #EF4444;
      --coral-light: #FEE2E2;
      --amber-gold: #F59E0B;
      --text-dark: #1E293B;
      --text-muted: #475569;
      --card-white: #FFFFFF;
      --shadow-soft: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", "Heiti TC", sans-serif;
      background-color: var(--bg-cream);
      background-image: radial-gradient(var(--bg-pattern) 2px, transparent 2px);
      background-size: 28px 28px;
      color: var(--text-dark);
      overflow: hidden;
    }

    /* 主容器 */
    .app-shell {
      max-width: 900px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 10px 14px 12px;
      gap: 10px;
      position: relative;
    }

    /* 頂部標題與進度欄 */
    .top-header {
      background: linear-gradient(135deg, var(--header-yellow-start), var(--header-yellow-end));
      border: 3px solid var(--header-border);
      border-radius: 22px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }

    .teacher-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .teacher-avatar-lg {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid #F59E0B;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 3px 8px rgba(245, 158, 11, 0.25);
      overflow: hidden;
    }

    .brand-text h1 {
      font-size: 20px;
      font-weight: 800;
      color: #78350F;
      line-height: 1.25;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mode-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      color: #15803D;
      margin-top: 3px;
    }

    .mode-pill.cloud {
      color: #0369A1;
    }

    /* 學習進度星星區 */
    .progress-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(255, 255, 255, 0.9);
      padding: 6px 14px;
      border-radius: 16px;
      border: 2px solid #FCD34D;
      flex-shrink: 0;
    }

    .progress-label {
      font-size: 15px;
      font-weight: 800;
      color: #92400E;
      margin-bottom: 2px;
    }

    .stars-row {
      display: flex;
      gap: 6px;
      font-size: 22px;
      line-height: 1;
    }

    .star-item {
      filter: grayscale(100%) opacity(0.35);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
      display: inline-block;
    }

    .star-item.lit {
      filter: grayscale(0%) opacity(1);
      transform: scale(1.18);
    }

    /* 右上角工具按鈕 */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: #FFFFFF;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
      box-shadow: 0 2px 0 #CBD5E1;
    }

    .icon-btn:hover {
      background: #F8FAFC;
      transform: translateY(-1px);
    }

    .icon-btn:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .icon-btn.tts-off {
      background: #F1F5F9;
      color: #64748B;
    }

    /* 固定句式提示卡 */
    .formula-banner {
      background: linear-gradient(90deg, #E0F2FE 0%, #F0FDF4 100%);
      border: 3px solid #7DD3FC;
      border-radius: 18px;
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
      flex-shrink: 0;
    }

    .formula-title {
      font-size: 17px;
      font-weight: 800;
      color: #0369A1;
      margin-right: 4px;
    }

    .formula-tag {
      font-size: 18px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 12px;
      border: 2px solid transparent;
    }

    .tag-subject {
      background: #FFEDD5;
      color: #9A3412;
      border-color: #FDBA74;
    }

    .tag-verb {
      background: #FCE7F3;
      color: #9D174D;
      border-color: #F9A8D4;
    }

    .tag-quant {
      background: #DBEAFE;
      color: #1E40AF;
      border-color: #93C5FD;
    }

    .tag-adj {
      background: #F3E8FF;
      color: #6B21A8;
      border-color: #D8B4FE;
    }

    .tag-noun {
      background: #DCFCE7;
      color: #166534;
      border-color: #86EFAC;
    }

    .formula-plus {
      font-size: 18px;
      font-weight: 900;
      color: #64748B;
    }

    /* 對話訊息區 */
    .chat-container {
      flex: 1;
      background: rgba(255, 255, 255, 0.92);
      border: 3px solid #E2E8F0;
      border-radius: 24px;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: var(--shadow-soft);
      scroll-behavior: smooth;
    }

    .msg-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      max-width: 88%;
      animation: popIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg-row.teacher {
      align-self: flex-start;
    }

    .msg-row.student {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .avatar-sm {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2.5px solid #F59E0B;
      background: #FEF9C3;
      overflow: hidden;
    }

    .msg-row.student .avatar-sm {
      border-color: #22C55E;
      background: #DCFCE7;
      font-size: 24px;
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sender-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0 4px;
    }

    .msg-row.student .sender-name {
      text-align: right;
    }

    .bubble {
      font-size: 20px;
      line-height: 1.65;
      padding: 14px 18px;
      border-radius: 20px;
      word-break: break-word;
      white-space: pre-line;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
    }

    .msg-row.teacher .bubble {
      background: #F0F9FF;
      border: 2.5px solid #BAE6FD;
      border-top-left-radius: 6px;
      color: #0F172A;
    }

    .msg-row.student .bubble {
      background: #DCFCE7;
      border: 2.5px solid #86EFAC;
      border-top-right-radius: 6px;
      color: #14532D;
      font-weight: 600;
    }

    .replay-btn {
      align-self: flex-start;
      background: #FFFFFF;
      border: 2px solid #7DD3FC;
      color: #0284C7;
      font-size: 15px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    .replay-btn:hover {
      background: #E0F2FE;
    }

    .replay-btn.speaking {
      background: #0284C7;
      color: #FFFFFF;
      border-color: #0284C7;
    }

    /* 過關慶祝卡片 */
    .victory-card {
      background: linear-gradient(135deg, #FEF9C3 0%, #DCFCE7 100%);
      border: 3px solid #FACC15;
      border-radius: 22px;
      padding: 18px;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      animation: popIn 0.4s ease;
    }

    .victory-card.show {
      display: flex;
    }

    .victory-stars {
      font-size: 36px;
      letter-spacing: 6px;
    }

    .victory-text {
      font-size: 20px;
      font-weight: 800;
      color: #854D0E;
    }

    .restart-btn {
      background: linear-gradient(180deg, #FBBF24 0%, #F59E0B 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      padding: 12px 28px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 0 #B45309;
      transition: transform 0.15s ease;
    }

    .restart-btn:hover {
      transform: translateY(-2px);
    }

    .restart-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    /* 語音狀態提示條 */
    .voice-status-bar {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #FEF2F2;
      border: 2px solid #FCA5A5;
      color: #B91C1C;
      font-size: 15px;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 14px;
      flex-shrink: 0;
      text-align: center;
    }

    .voice-status-bar.active {
      display: flex;
    }

    .voice-status-bar.info {
      background: #F0F9FF;
      border-color: #7DD3FC;
      color: #0369A1;
    }

    .rec-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #EF4444;
      flex-shrink: 0;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }

    /* 底部輸入控制區 */
    .input-area {
      background: #FFFFFF;
      border: 3px solid #CBD5E1;
      border-radius: 22px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }

    .input-area:focus-within {
      border-color: var(--sky-blue-btn);
    }

    .chat-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 20px;
      font-family: inherit;
      color: var(--text-dark);
      background: transparent;
      padding: 8px 6px;
      min-width: 0;
    }

    .chat-input::placeholder {
      color: #94A3B8;
      font-size: 18px;
    }

    .mic-btn {
      background: linear-gradient(180deg, #38BDF8 0%, #0284C7 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      height: 52px;
      padding: 0 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 0 #0369A1;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .mic-btn:hover {
      filter: brightness(1.05);
    }

    .mic-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #0369A1;
    }

    .mic-btn.recording {
      background: linear-gradient(180deg, #F87171 0%, #DC2626 100%);
      box-shadow: 0 0 0 5px rgba(239, 68, 68, 0.28), 0 4px 0 #991B1B;
      animation: pulseMic 1.2s infinite;
    }

    @keyframes pulseMic {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5), 0 4px 0 #991B1B; }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0), 0 4px 0 #991B1B; }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0), 0 4px 0 #991B1B; }
    }

    .send-btn {
      background: linear-gradient(180deg, #4ADE80 0%, #16A34A 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      height: 52px;
      padding: 0 22px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 0 #15803D;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      filter: brightness(1.05);
    }

    .send-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #15803D;
    }

    .send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    /* 老師設定彈窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: #FFFFFF;
      border-radius: 24px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.22);
      border: 3px solid #E2E8F0;
      animation: popIn 0.22s ease;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .modal-header h2 {
      font-size: 21px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .close-modal {
      background: #F1F5F9;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      color: #475569;
    }

    .modal-desc {
      font-size: 15px;
      line-height: 1.55;
      color: var(--text-muted);
      background: #F8FAFC;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text-dark);
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 2px solid #CBD5E1;
      border-radius: 12px;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus {
      border-color: var(--sky-blue-btn);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .btn-secondary {
      background: #F1F5F9;
      color: #334155;
      border: none;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #0284C7;
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 彩色紙屑畫布 */
    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    /* 響應式適配（平板與手機） */
    @media (max-width: 680px) {
      .app-shell {
        padding: 8px;
        gap: 8px;
      }

      .top-header {
        flex-wrap: wrap;
        padding: 8px 12px;
      }

      .brand-text h1 {
        font-size: 18px;
      }

      .progress-box {
        order: 3;
        width: 100%;
        flex-direction: row;
        justify-content: space-between;
        padding: 5px 14px;
      }

      .formula-banner {
        padding: 8px 10px;
        gap: 4px;
      }

      .formula-title {
        width: 100%;
        text-align: center;
        font-size: 15px;
        margin-bottom: 2px;
      }

      .formula-tag {
        font-size: 15px;
        padding: 3px 7px;
      }

      .formula-plus {
        font-size: 15px;
      }

      .msg-row {
        max-width: 95%;
      }

      .bubble {
        font-size: 18px;
        padding: 12px 14px;
      }

      .mic-btn span.btn-label {
        display: none;
      }

      .mic-btn {
        padding: 0 14px;
      }

      .send-btn {
        padding: 0 16px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <canvas id="confettiCanvas"></canvas>

  <div class="app-shell">
    <!-- 頂部馮老師資訊與學習進度 -->
    <header class="top-header">
      <div class="teacher-brand">
        <div class="teacher-avatar-lg" aria-hidden="true" id="headerTeacherAvatar"></div>
        <div class="brand-text">
          <h1>與馮老師語文對話練習</h1>
          <div class="mode-pill" id="engineModeBadge">🟢 離線智能引擎模式</div>
        </div>
      </div>

      <div class="progress-box" aria-label="學習進度">
        <div class="progress-label" id="progressText">第 1 題 / 共 3 題</div>
        <div class="stars-row" id="starsRow">
          <span class="star-item" id="star1">⭐</span>
          <span class="star-item" id="star2">⭐</span>
          <span class="star-item" id="star3">⭐</span>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="icon-btn" id="ttsToggleBtn" title="開啟或關閉自動粵語朗讀">
          🔊 <span id="ttsToggleLabel">粵語朗讀開</span>
        </button>
        <button type="button" class="icon-btn" id="openSettingsBtn" title="老師 API 設定">
          ⚙️ 老師設定
        </button>
      </div>
    </header>

    <!-- 固定句式提示橫幅 -->
    <section class="formula-banner" aria-label="句式提示卡">
      <span class="formula-title">💡 句式提示：</span>
      <span class="formula-tag tag-subject">【 人物 / 動物 】</span>
      <span class="formula-plus">＋</span>
      <span class="formula-tag tag-verb">有</span>
      <span class="formula-plus">＋</span>
      <span class="formula-tag tag-quant">【 數量詞 】</span>
      <span class="formula-plus">＋</span>
      <span class="formula-tag tag-adj">【 形容詞 】</span>
      <span class="formula-plus">＋</span>
      <span class="formula-tag tag-noun">【 名詞 】</span>
    </section>

    <!-- 對話視窗 -->
    <main class="chat-container" id="chatContainer" aria-live="polite">
      <!-- 對話氣泡將由 JS 動態插入 -->
      <div class="victory-card" id="victoryCard">
        <div class="victory-stars">🌟 🌟 🌟</div>
        <div class="victory-text">恭喜你完成全部 3 題句式練習！</div>
        <button type="button" class="restart-btn" id="restartBtn">🔄 再玩一次</button>
      </div>
    </main>

    <!-- 語音辨識 / 粵語語音狀態提示條 -->
    <div class="voice-status-bar" id="voiceStatusBar" role="status">
      <span class="rec-dot" id="voiceRecDot"></span>
      <span id="voiceStatusText">正在聆聽中，請對著麥克風說話...</span>
    </div>

    <!-- 底部輸入與麥克風區 -->
    <footer class="input-area">
      <input
        type="text"
        id="userInput"
        class="chat-input"
        placeholder="請輸入完整句子，或按右邊麥克風說話..."
        autocomplete="off"
        enterkeyhint="send"
      />
      <button type="button" class="mic-btn" id="micBtn" title="點擊開始粵語語音輸入">
        🎙️ <span class="btn-label" id="micBtnLabel">說話</span>
      </button>
      <button type="button" class="send-btn" id="sendBtn">
        發送 ➤
      </button>
    </footer>
  </div>

  <!-- 老師設定視窗 -->

            reply: FIXED_REPLIES.check4_noQuantifier,
            passed: false
          };
        }

        // 【檢查 5：缺少「形容詞」】
        const afterYouNoQuant = afterYou.replace(quantMatch[0], "###");
        let adjMatch = findFirstMatch(afterYouNoQuant, ADJECTIVE_WORDS);
        if (!adjMatch) {
          const deAdj = afterYouNoQuant.match(/([\u4e00-\u9fa5]{1,3}的)/);
          if (deAdj) {
            adjMatch = { index: deAdj.index, word: deAdj[1] };
          }
        }
        if (!adjMatch) {
          return {
            reply: FIXED_REPLIES.check5_noAdjective,
            passed: false
          };
        }

        // 【檢查 6：缺少「名詞」】
        const nounMatch = findFirstMatch(afterYou, NOUN_WORDS);
        if (!nounMatch) {
          return {
            reply: FIXED_REPLIES.check6_noNoun,
            passed: false
          };
        }

        // 【檢查 7：詞語次序錯誤】
        const quantPos = afterYou.indexOf(quantMatch[0]);
        const adjPos = afterYou.indexOf(adjMatch.word);
        const nounPos = nounMatch.index;

        const isOrderValid =
          subjectMatch.index < youIndex &&
          quantPos !== -1 &&
          adjPos !== -1 &&
          nounPos !== -1 &&
          quantPos < adjPos &&
          adjPos < nounPos &&
          nounPos + nounMatch.word.length === afterYou.length;

        if (!isOrderValid) {
          return {
            reply: FIXED_REPLIES.check7_wrongOrder,
            passed: false
          };
        }

        // 【情況 B：句式完全正確，且內容完全符合標準答案】
        if (currentQ.answers.includes(cleanText)) {
          if (currentQIndex < QUESTIONS.length - 1) {
            const nextQ = QUESTIONS[currentQIndex + 1];
            return {
              reply: `答對了！句式和內容都非常標準！🌟 我們繼續下一題吧：\n\n第 ${nextQ.id} 題：${nextQ.question}`,
              passed: true
            };
          } else {
            return {
              reply: ALL_COMPLETED_MESSAGE,
              passed: true,
              completedAll: true
            };
          }
        }

        // 【情況 A：句式正確，但事實/內容與標準答案不符】
        return {
          reply: FIXED_REPLIES.wrongContent,
          passed: false
        };
      }

      /* =========================================================
       * 5. OpenAI 兼容 API 串接（若老師有設定 API Key）
       * ========================================================= */
      function buildSystemPrompt(currentQIndex) {

- 【檢查 1：書面語規範】若包含廣東話口語字詞（如：呢個、嗰個、唔係、冇、點解、做咩、係咪、邊個、佢、啲、咁、睇、食、嘢等），必須回覆：

  句子中要有數量詞（例如：一個、兩個、三個），要放在形容詞前面喔！
- 【檢查 5：缺少「形容詞」】若沒有形容詞（如藍色、圓圓、甜甜），必須回覆：

      async function evaluateWithLLM(rawInput, currentQIndex, settings, history) {
        const endpoint = (settings.endpoint || "https://api.openai.com/v1/chat/completions").trim();
        const model = (settings.model || "gpt-4o-mini").trim();

        const messages = [
          { role: "system", content: buildSystemPrompt(currentQIndex) },
          ...history.slice(-6),
          { role: "user", content: toTraditionalChinese(rawInput.trim()) }
        ];

        const response = await fetch(endpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${settings.apiKey.trim()}`
          },
          body: JSON.stringify({
            model,
            messages,
            temperature: 0.1,
            max_tokens: 220
          })
        });

        if (!response.ok) {
          throw new Error(`API HTTP ${response.status}`);
        }

        const data = await response.json();
        let text = data?.choices?.[0]?.message?.content?.trim() || "";
        if (!text) {
          throw new Error("Empty API response");
        }

        const passed = text.startsWith("[PASS]");
        text = text.replace(/^\[PASS\]\s*/i, "");

        return {
          reply: text,
          passed,
          completedAll: passed && currentQIndex === QUESTIONS.length - 1
        };
      }

      /* =========================================================
       * 6. 強制粵語語音朗讀功能（TTS - Strict Cantonese zh-HK / yue）
       * ========================================================= */
      let ttsEnabled = true;
      let availableVoices = [];
      let activeReplayBtn = null;
      let hasWarnedMissingCantoneseVoice = false;

      function refreshVoices() {
        if ("speechSynthesis" in window) {
          const list = window.speechSynthesis.getVoices();
          if (list && list.length > 0) {
            availableVoices = list;
          }
        }
        return availableVoices;
      }

      if ("speechSynthesis" in window) {
        refreshVoices();
        window.speechSynthesis.onvoiceschanged = refreshVoices;
      }

      function ensureVoicesLoaded(timeoutMs = 650) {
        return new Promise((resolve) => {
          if (!("speechSynthesis" in window)) {
            resolve([]);
            return;
          }
          const existing = refreshVoices();
          if (existing.length > 0) {
            resolve(existing);
            return;
          }
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            resolve(refreshVoices());
          };
          const prevHandler = window.speechSynthesis.onvoiceschanged;
          window.speechSynthesis.onvoiceschanged = () => {
            if (typeof prevHandler === "function") prevHandler();
            finish();
          };
          setTimeout(finish, timeoutMs);
        });
      }

      function isCantoneseVoice(voice) {
        if (!voice) return false;
        const langNorm = (voice.lang || "").replace(/_/g, "-").toLowerCase();
        const nameNorm = (voice.name || "").toLowerCase();

        // 嚴格匹配香港粵語語言代碼（zh-HK / yue / yue-HK / yue-Hant-HK）
        if (langNorm === "zh-hk" || langNorm.startsWith("yue")) {
          return true;
        }
        // 嚴格匹配常見系統粵語語音包名稱（絕不匹配普通話/國語）
        if (
          /cantonese|hong\s*kong|香港|粵語|廣東話|广东话|sinji|hiugaai|hiumaan|wanlung/i.test(nameNorm)
        ) {
          return true;
        }
        return false;
      }

      function pickCantoneseVoice() {
        const voices = refreshVoices();
        const cantoneseVoices = voices.filter(isCantoneseVoice);
        if (!cantoneseVoices.length) return null;

        // 優先選擇親切女聲（HiuGaai / HiuMaan / Sinji / Google 粵語）
        return (
          cantoneseVoices.find((v) => /hiugaai|hiumaan|sinji|female|女/i.test(v.name)) ||
          cantoneseVoices.find((v) => /google/i.test(v.name)) ||
          cantoneseVoices[0]
        );
      }

      function sanitizeTextForCantoneseSpeech(text) {
        const numMap = { "1": "一", "2": "二", "3": "三" };
        return text
          // 將「第 1 題」轉成「第一題」，確保粵語讀音自然連貫
          .replace(/第\s*([123])\s*題/g, (_, d) => `第${numMap[d]}題`)
          // 移除表情符號與裝飾框線，避免語音引擎讀出無關符號名
          .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu, "")
          .replace(/……/g, "，")
          .replace(/『|』|「|」/g, "")
          .replace(/\n+/g, "。")
          .trim();
      }

      async function speakText(text, btnElement = null, forceSpeak = false) {
        if (!("speechSynthesis" in window)) return;
        if (!ttsEnabled && !forceSpeak) return;

        await ensureVoicesLoaded(650);

        window.speechSynthesis.cancel();
        if (activeReplayBtn) {
          activeReplayBtn.classList.remove("speaking");
          activeReplayBtn = null;
        }

        const cleanSpeech = sanitizeTextForCantoneseSpeech(text);
        if (!cleanSpeech) return;

        const cantoneseVoice = pickCantoneseVoice();

        // 若裝置系統完全未安裝任何粵語語音包，給予一次性友善提示，絕不降級使用普通話語音物件
        if (!cantoneseVoice && availableVoices.length > 0 && !hasWarnedMissingCantoneseVoice) {
          hasWarnedMissingCantoneseVoice = true;
          showVoiceStatus(
            "提示：此裝置暫未偵測到系統「粵語（香港）」語音包，已強制鎖定 zh-HK 粵語模式（建議使用 iPad/iPhone Safari 或已安裝香港粵語語音的 Edge/Chrome）。",
            true,
            7000
          );
        }

        const utterance = new SpeechSynthesisUtterance(cleanSpeech);
        if (cantoneseVoice) {
          utterance.voice = cantoneseVoice;
          utterance.lang = cantoneseVoice.lang || "zh-HK";
        } else {
          utterance.lang = "zh-HK";
        }
        utterance.rate = 0.92;
        utterance.pitch = 1.05;

        if (btnElement) {
          activeReplayBtn = btnElement;
          btnElement.classList.add("speaking");
        }

        utterance.onend = () => {
          if (activeReplayBtn) {
            activeReplayBtn.classList.remove("speaking");
            activeReplayBtn = null;
          }
        };

        utterance.onerror = () => {
          if (activeReplayBtn) {
            activeReplayBtn.classList.remove("speaking");
            activeReplayBtn = null;
          }
        };

        setTimeout(() => {
          try {
            window.speechSynthesis.speak(utterance);
          } catch (err) {
            // 忽略瀏覽器首次自動播放限制錯誤
          }
        }, 30);
      }

      /* =========================================================
       * 7. 語音輸入（Web Speech API - 粵語 zh-HK）
       * ========================================================= */
      const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null;

      function showVoiceStatus(message, isInfo = false, autoHideMs = 0) {

      function setRecordingUI(recording) {
        isRecording = recording;
        const micBtn = document.getElementById("micBtn");
        const micLabel = document.getElementById("micBtnLabel");
        if (recording) {
          micBtn.classList.add("recording");

      function initSpeechRecognition() {
        if (!SpeechRecognitionAPI) return;

        recognition = new SpeechRecognitionAPI();
        recognition.lang = "zh-HK";
        recognition.interimResults = true;
        recognition.continuous = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
          }
          setRecordingUI(true);
          showVoiceStatus("正在聆聽中，請對著麥克風說出完整句子...", false);
        };

        recognition.onresult = (event) => {
          let transcript = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          const traditionalText = toTraditionalChinese(transcript);
          const inputEl = document.getElementById("userInput");
          inputEl.value = traditionalText;
        };

        recognition.onerror = (event) => {
          setRecordingUI(false);
          if (event.error === "not-allowed" || event.error === "service-not-allowed") {
            showVoiceStatus("未取得麥克風權限，請在瀏覽器允許使用麥克風，或直接用鍵盤輸入喔！", true, 5000);
          } else if (event.error === "no-speech") {
            showVoiceStatus("馮老師剛才沒有聽到聲音，請再按一次麥克風說話喔！", true, 4000);
          } else {
            showVoiceStatus("語音辨識未能完成，請再試一次或使用鍵盤輸入。", true, 4000);
          }
        };

        recognition.onend = () => {
          const wasRecording = isRecording;
          setRecordingUI(false);
          const inputEl = document.getElementById("userInput");
          if (wasRecording && inputEl.value.trim()) {
            showVoiceStatus("辨識完成！請檢查句子是否正確，然後按「發送」喔！😊", true, 4500);
            inputEl.focus();
          } else if (wasRecording) {
            hideVoiceStatus();
          }
        };
      }

      function toggleVoiceInput() {
        if (!SpeechRecognitionAPI) {
          showVoiceStatus("此瀏覽器暫不支援語音輸入，建議使用 Chrome / Edge，或直接用鍵盤打字喔！", true, 5500);
          return;
        }
        if (!recognition) {
          initSpeechRecognition();
        }
        if (isRecording) {
          recognition.stop();
        } else {
          try {
            recognition.start();
          } catch (err) {
            setRecordingUI(false);
          }
        }
      }

      /* =========================================================
       * 8. 過關彩色紙屑（Confetti）動畫
       * ========================================================= */
      function launchConfetti() {
        const canvas = document.getElementById("confettiCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ["#FACC15", "#38BDF8", "#4ADE80", "#F472B6", "#A78BFA", "#FB923C"];
        const pieces = Array.from({ length: 130 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          w: Math.random() * 11 + 6,
          h: Math.random() * 7 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: Math.random() * 3.5 + 2.5,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 0.15
        }));

        let frame = 0;
        const maxFrames = 210;

        function render() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          for (const p of pieces) {
            p.x += p.vx;
            p.y += p.vy;
            p.angle += p.spin;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
          }
          frame++;
          if (frame < maxFrames) {
            requestAnimationFrame(render);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }

        requestAnimationFrame(render);
      }

        row.appendChild(avatar);
        row.appendChild(bubbleWrap);

        chatContainer.insertBefore(row, victoryCard);
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }

      async function handleSend() {
        if (isProcessing) return;

        const inputEl = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const rawText = inputEl.value.trim();

        if (!rawText) {
          inputEl.focus();
          return;
        }

        if (isRecording && recognition) {
          recognition.stop();
        }

        hideVoiceStatus();
        const displayUserText = toTraditionalChinese(rawText);
        appendMessage("student", displayUserText, false);
        inputEl.value = "";

        isProcessing = true;
        sendBtn.disabled = true;

        const settings = getTeacherSettings();
        let outcome = null;

        try {
          if (settings.apiKey && settings.apiKey.trim().length > 0 && !isFinished) {
            outcome = await evaluateWithLLM(
              displayUserText,
              currentQuestionIndex,
              settings,
              conversationHistory
            );
          } else {
            outcome = evaluateWithRuleEngine(displayUserText, currentQuestionIndex);
          }
        } catch (err) {
          outcome = evaluateWithRuleEngine(displayUserText, currentQuestionIndex);
        }

        conversationHistory.push({ role: "user", content: displayUserText });
        conversationHistory.push({ role: "assistant", content: outcome.reply });

        if (outcome.passed) {
          if (outcome.completedAll || currentQuestionIndex >= QUESTIONS.length - 1) {
            isFinished = true;
            updateProgressUI();
            appendMessage("teacher", outcome.reply, true);
            document.getElementById("victoryCard").classList.add("show");
            const chatContainer = document.getElementById("chatContainer");
            chatContainer.scrollTop = chatContainer.scrollHeight;
            launchConfetti();
          } else {
            currentQuestionIndex++;
            updateProgressUI();
            appendMessage("teacher", outcome.reply, true);
          }
        } else {
          appendMessage("teacher", outcome.reply, true);
        }

        isProcessing = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }

      function resetPractice() {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
        currentQuestionIndex = 0;
        isFinished = false;
        isProcessing = false;
        conversationHistory = [];

        const chatContainer = document.getElementById("chatContainer");
        const victoryCard = document.getElementById("victoryCard");
        victoryCard.classList.remove("show");

        const oldRows = chatContainer.querySelectorAll(".msg-row");
        oldRows.forEach((row) => row.remove());

        updateProgressUI();
        appendMessage("teacher", OPENING_MESSAGE, true);
        document.getElementById("userInput").focus();
      }

      /* =========================================================
       * 11. 初始化與事件綁定
       * ========================================================= */
      document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("headerTeacherAvatar").innerHTML = TEACHER_SVG;
        updateEngineBadge();
        updateProgressUI();

        // 顯示開場白並以粵語自動朗讀
        appendMessage("teacher", OPENING_MESSAGE, true);

        const unlockAudioOnce = () => {
          if ("speechSynthesis" in window && window.speechSynthesis.paused) {
            window.speechSynthesis.resume();
          }
          document.removeEventListener("click", unlockAudioOnce);
        };
        document.addEventListener("click", unlockAudioOnce);

        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        let isComposing = false;

        userInput.addEventListener("compositionstart", () => {
          isComposing = true;
        });

        userInput.addEventListener("compositionend", () => {
          isComposing = false;
        });

        userInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !isComposing && !e.isComposing && e.keyCode !== 229) {
            e.preventDefault();
            handleSend();
          }
        });

        sendBtn.addEventListener("click", handleSend);

        document.getElementById("micBtn").addEventListener("click", toggleVoiceInput);

        const ttsToggleBtn = document.getElementById("ttsToggleBtn");
        const ttsToggleLabel = document.getElementById("ttsToggleLabel");
        ttsToggleBtn.addEventListener("click", () => {
          ttsEnabled = !ttsEnabled;
          if (ttsEnabled) {
            ttsToggleBtn.classList.remove("tts-off");
            ttsToggleLabel.textContent = "粵語朗讀開";
          } else {
            ttsToggleBtn.classList.add("tts-off");
            ttsToggleLabel.textContent = "粵語朗讀關";
            if ("speechSynthesis" in window) {
              window.speechSynthesis.cancel();
            }
          }
        });

        document.getElementById("restartBtn").addEventListener("click", resetPractice);

        const settingsModal = document.getElementById("settingsModal");
        const apiKeyInput = document.getElementById("apiKeyInput");
        const apiEndpointInput = document.getElementById("apiEndpointInput");
        const apiModelInput = document.getElementById("apiModelInput");

        document.getElementById("openSettingsBtn").addEventListener("click", () => {
          const current = getTeacherSettings();
          apiKeyInput.value = current.apiKey || "";
          apiEndpointInput.value = current.endpoint || "https://api.openai.com/v1/chat/completions";
          apiModelInput.value = current.model || "gpt-4o-mini";
          settingsModal.classList.add("open");
        });

        document.getElementById("closeSettingsBtn").addEventListener("click", () => {
          settingsModal.classList.remove("open");
        });

        settingsModal.addEventListener("click", (e) => {
          if (e.target === settingsModal) {
            settingsModal.classList.remove("open");
          }
        });

        document.getElementById("saveSettingsBtn").addEventListener("click", () => {
          saveTeacherSettings({
            apiKey: apiKeyInput.value.trim(),
            endpoint: apiEndpointInput.value.trim() || "https://api.openai.com/v1/chat/completions",
            model: apiModelInput.value.trim() || "gpt-4o-mini"
          });
          settingsModal.classList.remove("open");
        });

        document.getElementById("clearSettingsBtn").addEventListener("click", () => {
          apiKeyInput.value = "";
          apiEndpointInput.value = "https://api.openai.com/v1/chat/completions";
          apiModelInput.value = "gpt-4o-mini";
          saveTeacherSettings({
            apiKey: "",
            endpoint: "https://api.openai.com/v1/chat/completions",
            model: "gpt-4o-mini"
          });
          settingsModal.classList.remove("open");
        });
      });
    })();
  </script>
</body>
